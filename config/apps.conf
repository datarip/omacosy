# App choices for keybindings. Override in config/apps.local.conf
# (gitignored) — same KEY=Value lines — then re-run install.sh.
TERMINAL=Ghostty
# Super+Space: auto, raycast, tinycast, alfred, omniwm or none.
# auto = Raycast under AeroSpace, OmniWM's launcher under OmniWM.
# none = unbound; use it for an unsupported launcher (LaunchBar,
# Quicksilver, Spotlight, a custom script), a launcher's own hotkey, or no
# launcher at all.
LAUNCHER=auto
# OmniWM clipboard history: on, off or follow-launcher.
# follow-launcher disables it when Super+Space opens another launcher; it
# never turns it back on by itself (use on for that).
OMNIWM_CLIPBOARD=follow-launcher
# BROWSER and EMAIL are unset on purpose: those chords follow the macOS
# default web browser and mail app. Set either to an app name here or in
# config/apps.local.conf to pin it.
MUSIC=Spotify
MESSENGER=Slack
